# Overlay for deploying the alpha-testing fork build (mobile pairing included)
# with HTTPS via Caddy. Use together with the prod file:
#
#   docker compose -f docker-compose.prod.yml -f docker-compose.alpha.yml up -d
#
# Requires in .env: SECRET_KEY, DOMAIN (securo web UI, e.g. example.com),
# PWA_DOMAIN (mobile PWA, e.g. app.example.com), FRONTEND_URL=https://$DOMAIN
services:
  backend:
    image: ghcr.io/jacklu97/securo-backend:alpha
    # Not published to the host — Caddy → frontend nginx → backend.
    ports: !reset []

  celery-worker:
    image: ghcr.io/jacklu97/securo-backend:alpha

  celery-beat:
    image: ghcr.io/jacklu97/securo-backend:alpha

  mcp-server:
    image: ghcr.io/jacklu97/securo-backend:alpha

  frontend:
    image: ghcr.io/jacklu97/securo-frontend:alpha
    environment:
      BACKEND_URL: http://backend:8000
      FRONTEND_URL: https://${DOMAIN}
    # Only reachable through Caddy.
    ports: !reset []

  caddy:
    image: docker.io/library/caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      PWA_DOMAIN: ${PWA_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # securo-mobile PWA build, rsynced here by that repo's deploy workflow.
      - ./pwa:/srv/pwa:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

  # --- agents profile: local LLM + Telegram-group RAG for the chatbot ---

  ollama:
    image: docker.io/ollama/ollama:latest
    profiles: [agents]
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama

  telegram-rag:
    image: ghcr.io/jacklu97/securo-telegram-rag:latest
    profiles: [agents]
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_SESSION_STRING: ${TELEGRAM_SESSION_STRING:-}
      TELEGRAM_GROUP: ${TELEGRAM_GROUP:-}
      # Must match the backend's AGENTS_MCP_JWT_SECRET so securo-minted
      # tokens verify on the RAG server.
      MCP_JWT_SECRET: ${AGENTS_MCP_JWT_SECRET:-dev-mcp-secret-change-in-production}
    volumes:
      - telegram_rag_data:/data

volumes:
  caddy_data:
  caddy_config:
  ollama_models:
  telegram_rag_data:
